name: "Test Suite"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run automated tests
        run: vendor/bin/phpunit

  assets:
    runs-on: ubuntu-latest
    name: JavaScript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: assets
        run: npm install

      - name: Build assets
        working-directory: assets
        run: npm run build

      - name: Run tests
        working-directory: assets
        run: npm test
