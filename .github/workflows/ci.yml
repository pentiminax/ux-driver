name: "Test Suite"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Dump PHP diagnostics
        run: php -i && php -m

      - name: Install dependencies
        run: composer install --no-progress

      - name: Check for dangerous and broken dependencies
        run: composer audit

      - name: Run automated tests
        run: vendor/bin/phpunit --coverage-text --coverage-xml build/coverage-xml --coverage-cobertura build/cobertura.xml

      - name: Run static analysis
        run: composer analyse

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        driver: ['1.8.0', 'latest']
    name: JS (driver.js ${{ matrix.driver }})
    defaults:
      run:
        working-directory: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-progress

      - name: Pin driver.js to the minimum supported version
        if: matrix.driver != 'latest'
        run: npm install driver.js@${{ matrix.driver }} --no-save

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the committed dist matches a fresh build
        run: git diff --exit-code dist
